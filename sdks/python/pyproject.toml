[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pesajet"
version = "1.0.0"
description = "Official PesaJet Payments & Webhooks SDK for Python"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "PesaJet Developer Experience Team", email = "munelian@gmail.com"}
]
keywords = ["pesajet", "mobile-money", "mtn-momo", "airtel-money", "uganda", "payments", "fintech","emoments","e-moments"]
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://pay.pesajet.com"
Repository = "https://github.com/pesajet/pesajet-pay-demo"

